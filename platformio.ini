; Mini Kana Player — ESP32-S3 DevKit N16R8 + Waveshare 2.13" e-Paper HAT V4

[env:kana_player]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash 16 Mo
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    zinggjm/GxEPD2@^1.6.0

; Essayés dans l'ordre : Mac, Windows
custom_upload_ports =
    /dev/cu.usbmodem5C4C1471021
    COM6
extra_scripts = pre:tools/upload_port.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
